name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dominio:
    name: Motor de cálculo (swift test)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Versión de Swift
        run: swift --version
      - name: Pruebas del dominio
        run: swift test --parallel

  ios:
    name: App iOS (xcodebuild)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DESTINO: platform=iOS Simulator,name=iPhone 17,OS=26.5
      DERIVADOS: ${{ github.workspace }}/DerivedData
      RESULTADOS: ${{ github.workspace }}/resultados-ci
    steps:
      - uses: actions/checkout@v5

      - name: Seleccionar Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          mkdir -p "$RESULTADOS"

      - name: Compilar para pruebas
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HydroFesFlow.xcodeproj \
            -scheme HydroFesFlow \
            -destination "$DESTINO" \
            -derivedDataPath "$DERIVADOS" \
            CODE_SIGNING_ALLOWED=NO \
            > "$RESULTADOS/compilacion.log" 2>&1 \
            || { grep -E "error:|warning: .*will be an error" "$RESULTADOS/compilacion.log"; tail -40 "$RESULTADOS/compilacion.log"; exit 1; }

      - name: Sin advertencias del compilador
        run: |
          advertencias=$(grep -E "\.swift:[0-9]+:[0-9]+: warning:" "$RESULTADOS/compilacion.log" | sort -u || true)
          if [ -n "$advertencias" ]; then
            echo "$advertencias"
            echo "::error::El compilador de Swift emitió advertencias en el proyecto."
            exit 1
          fi
          echo "Sin advertencias de Swift."

      - name: Pruebas unitarias
        run: |
          xcodebuild test-without-building \
            -project HydroFesFlow.xcodeproj \
            -scheme HydroFesFlow \
            -destination "$DESTINO" \
            -derivedDataPath "$DERIVADOS" \
            -only-testing:HydroFesFlowTests \
            -resultBundlePath "$RESULTADOS/unitarias.xcresult"

      - name: Pruebas de interfaz
        run: |
          xcodebuild test-without-building \
            -project HydroFesFlow.xcodeproj \
            -scheme HydroFesFlow \
            -destination "$DESTINO" \
            -derivedDataPath "$DERIVADOS" \
            -only-testing:HydroFesFlowUITests \
            -resultBundlePath "$RESULTADOS/interfaz.xcresult"

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-ios
          path: resultados-ci
          if-no-files-found: ignore
          retention-days: 7
